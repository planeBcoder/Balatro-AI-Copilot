name: Windows tests and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install -r requirements.txt
      - name: Build and verify Windows packages
        shell: pwsh
        run: ./scripts/build-public.ps1 -Python (Get-Command python).Source
      - name: Verify install and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Release "$PWD/dist-public" -Report "$env:RUNNER_TEMP/installer-acceptance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Balatro-AI-Copilot-Windows
          path: dist-public/*
      - name: Publish tagged prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME dist-public/* --prerelease --title "Balatro AI Copilot $env:GITHUB_REF_NAME" --notes "Windows beta: automatic Steam discovery, offline setup, game HUD, hand and shop advice. Read README, PRIVACY and SECURITY before use."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "Verified build retained as workflow artifact; existing release assets preserved."
          }
